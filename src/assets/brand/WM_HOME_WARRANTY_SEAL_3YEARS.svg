<?xml version="1.0" encoding="UTF-8"?>
<!-- Extracted from the #warranty-seal <symbol> defined in the official
     WM_HOME_MASTER_PACKING_UNIVERSAL_EN.svg master template. Geometry and
     text are unmodified — only the accent color was changed from black
     (#111) to the site's wine accent (#6b1f2a), per brand request. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>3 Years Warranty</title>
  <circle cx="50" cy="50" r="46" fill="#fff" stroke="#6b1f2a" stroke-width="3"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#6b1f2a" stroke-width="1"/>
  <text x="50" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#6b1f2a" font-size="40" font-weight="700">3</text>
  <text x="50" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#6b1f2a" font-size="15" font-weight="700">YEARS</text>
  <text x="50" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#6b1f2a" font-size="6.5" font-weight="700">WARRANTY</text>
</svg>
